<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Material Tag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg: #eceee9;
    --card: #ffffff;
    --ink: #17241e;
    --muted: #5d6b63;
    --line: #cfd5cd;
    --pine: #1c5a43;
    --pine-dark: #123f2f;
    --alert: #b3401a;
    --ok-bg: #dcefe4;
    --err-bg: #f8dfd5;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px; line-height: 1.4;
  }
  header {
    background: var(--pine-dark); color: #fff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
  }
  h1, h2 { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; margin: 0; letter-spacing: .01em; }
  h1 { font-size: 28px; }
  h2 { font-size: 24px; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 16px; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 6px;
    border: 2px solid var(--pine); background: var(--pine); color: #fff;
    padding: 14px 16px; min-height: 52px;
  }
  button.secondary { background: #fff; color: var(--pine); }
  button.danger { background: #fff; color: var(--alert); border-color: var(--alert); }
  button.small { min-height: 40px; padding: 8px 12px; font-size: 15px; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 3px solid #e0a800; outline-offset: 2px; }
  header button { background: transparent; border-color: #ffffff80; }
  input[type=text] {
    font: inherit; width: 100%; min-height: 52px; padding: 10px 12px;
    border: 2px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink);
  }
  .row { display: flex; gap: 10px; }
  .row > input { flex: 1; }
  .stack { display: grid; gap: 12px; }
  #scanBtn { width: 100%; font-size: 19px; }
  #reader { margin-top: 12px; border-radius: 6px; overflow: hidden; }
  .tagid { font-family: "Barlow Condensed", sans-serif; font-size: 34px; font-weight: 700; }
  .muted { color: var(--muted); }
  .seg { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .seg button { background: #fff; color: var(--ink); border-color: var(--line); }
  .seg button[aria-pressed=true] { background: var(--pine); color: #fff; border-color: var(--pine); }
  .seg button.danger { border-color: var(--alert); color: var(--alert); }
  .seg button.danger:hover { background: var(--err-bg); }
  .seg button.danger[aria-pressed=true] { background: var(--alert); border-color: var(--alert); color: #fff; }
  .preview { width: 100%; max-height: 320px; object-fit: contain; border-radius: 6px; border: 1px solid var(--line); background: #f4f5f2; }
  .confirmbox { padding: 12px 14px; border-radius: 6px; background: var(--ok-bg); border: 1px solid #a9d3bc; }
  .confirmbox.out { background: var(--err-bg); border-color: #e3b5a2; }
  label { font-weight: 600; display: block; margin-bottom: 6px; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 8px 0 0; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; font-weight: 600; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 15px; font-weight: 600; background: var(--ok-bg); color: var(--pine-dark); }
  .badge.off { background: var(--err-bg); color: var(--alert); }
  .badge.new { background: #e6e8e4; color: var(--muted); }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 440px; }
  th, td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { font-weight: 600; color: var(--muted); font-size: 15px; }
  tfoot td { font-weight: 700; border-bottom: 0; border-top: 2px solid var(--ink); }
  td.zero { color: #a3ada6; }
  .combo { position: relative; }
  .combo input { padding-right: 60px; }
  .combo-toggle {
    position: absolute; right: 4px; top: 4px; min-height: 44px; width: 48px; padding: 0;
    background: transparent; color: var(--ink); border: 0; font-size: 18px;
  }
  #matList {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5;
    margin: 0; padding: 4px; list-style: none; background: #fff;
    border: 2px solid var(--line); border-radius: 6px; max-height: 280px; overflow-y: auto;
    box-shadow: 0 6px 18px rgba(0,0,0,.15);
  }
  #matList li { padding: 12px; min-height: 46px; border-radius: 4px; cursor: pointer; font-weight: 500; }
  #matList li:hover { background: #eef2ee; }
  #matList li[aria-selected=true] { background: var(--ok-bg); font-weight: 700; }
  #matList li.none { color: var(--muted); cursor: default; }
  #toast {
    position: fixed; left: 12px; right: 12px; bottom: 12px; max-width: 696px; margin: 0 auto;
    padding: 14px 16px; border-radius: 6px; font-weight: 600; display: none; z-index: 10;
    border: 1px solid var(--line);
  }
  #toast.ok { background: var(--ok-bg); display: block; }
  #toast.err { background: var(--err-bg); display: block; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: no-preference) { button { transition: background .12s; } }
</style>
</head>
<body>
<header>
  <h1>Material Tag</h1>
  <button class="small" id="refreshBtn" type="button">Refresh</button>
</header>

<main>
  <section class="card stack" aria-label="Find a tag">
    <button id="scanBtn" type="button">Scan QR tag</button>
    <div id="reader" hidden></div>
    <form id="manualForm" class="row" autocomplete="off">
      <input type="text" id="tagInput" placeholder="Or type tag ID, e.g. BRE1126-01" autocapitalize="characters" spellcheck="false" aria-label="Tag ID">
      <button type="submit" class="secondary">Look up</button>
    </form>
  </section>

  <section id="panel" class="card" hidden aria-live="polite"></section>

  <section class="card" aria-label="Current inventory">
    <div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:8px">
      <h2>Inventory</h2>
      <span class="muted" id="invMeta"></span>
    </div>
    <div class="tablewrap" id="inventory"><p class="muted">Loading…</p></div>
  </section>
</main>

<div id="toast" role="status"></div>

<script>
/* ====== SET THIS to your Apps Script Web app URL (ends in /exec) ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbx8g5THnLHxOEwJqDrQ_QpZ68Awp6h2i9vz3nobSf0YAa-TxRN3if6XroHnJg8TQNrZ/exec';
/* ====================================================================== */

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short = loc => loc.replace(' Yard', '');

let scanner = null;
let current = null;      // { tag, materials, locations, removed }
let pickedLocation = '';
let pickedTo = '';
let pickedMaterial = '';
let photoData = '';
const OUT_OPTIONS = ['Open']; // choices that take a unit out of inventory
let toastTimer;

function toast(msg, kind = 'ok') {
  const t = $('toast');
  t.textContent = msg;
  t.className = kind;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, kind === 'ok' ? 3500 : 6000);
}

async function get(params) {
  const r = await fetch(API_URL + '?' + new URLSearchParams(params));
  return r.json();
}
async function post(body) {
  // text/plain keeps this a "simple" request so the browser skips the CORS preflight
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  return r.json();
}

/* ---------- inventory ---------- */

async function loadInventory() {
  try {
    const d = await get({ action: 'inventory' });
    if (d.error) throw new Error(d.error);
    renderInventory(d);
  } catch (e) {
    $('inventory').innerHTML = '<p class="muted">Could not load inventory. ' + esc(e.message) + '</p>';
  }
}

function renderInventory(d) {
  $('invMeta').textContent = d.grandTotal + ' units · ' + d.unassigned + ' tags unassigned';
  if (!d.rows.length) {
    $('inventory').innerHTML = '<p class="muted">Nothing in inventory yet. Scan a tag to assign the first unit.</p>';
    return;
  }
  const gone = d.inactive || [];
  const head = d.locations.map(l => '<th>' + esc(short(l)) + (gone.includes(l) ? '<br><small>removed</small>' : '') + '</th>').join('');
  const body = d.rows.map(r =>
    '<tr><td>' + esc(r.material) + '</td>' +
    d.locations.map(l => '<td class="' + (r.counts[l] ? '' : 'zero') + '">' + r.counts[l] + '</td>').join('') +
    '<td><strong>' + r.total + '</strong></td></tr>'
  ).join('');
  const foot = '<tr><td>Total</td>' + d.locations.map(l => '<td>' + d.totals[l] + '</td>').join('') +
    '<td>' + d.grandTotal + '</td></tr>';
  $('inventory').innerHTML =
    '<table><thead><tr><th>Material</th>' + head + '<th>Total</th></tr></thead><tbody>' + body +
    '</tbody><tfoot>' + foot + '</tfoot></table>';
}

/* ---------- scanning ---------- */

async function stopScan() {
  if (scanner) {
    try { await scanner.stop(); scanner.clear(); } catch (_) {}
    scanner = null;
  }
  $('reader').hidden = true;
  $('scanBtn').textContent = 'Scan QR tag';
}

async function startScan() {
  if (scanner) { return stopScan(); }
  $('reader').hidden = false;
  $('scanBtn').textContent = 'Stop camera';
  scanner = new Html5Qrcode('reader');
  try {
    await scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      text => { stopScan(); lookup(text); },
      () => {}
    );
  } catch (e) {
    await stopScan();
    toast('Camera not available. Type the tag ID instead.', 'err');
  }
}

/* ---------- tag lookup ---------- */

async function lookup(raw) {
  const id = String(raw || '').trim().toUpperCase();
  if (!id) return;
  $('tagInput').value = id;
  try {
    const d = await get({ action: 'tag', id });
    if (d.error) throw new Error(d.error);
    current = d;
    pickedLocation = '';
    pickedMaterial = '';
    renderPanel();
    $('panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    $('panel').hidden = true;
    toast(e.message, 'err');
  }
}

function renderPanel() {
  const { tag } = current;
  const panel = $('panel');
  panel.hidden = false;

  if (tag.state === 'active') return renderActive(panel, tag);
  renderAssign(panel, tag);
}

function renderAssign(panel, tag) {
  const locs = current.locations.map(l =>
    '<button type="button" data-loc="' + esc(l) + '" aria-pressed="' + (pickedLocation === l) + '">' + esc(l) + '</button>'
  ).join('');

  panel.innerHTML =
    '<div class="stack">' +
      '<div><span class="tagid">' + esc(tag.id) + '</span> ' +
      '<span class="badge new">Unassigned</span>' +
      '</div>' +
      '<div><label for="matInput">Material on this unit</label>' +
      '<div class="combo">' +
        '<input type="text" id="matInput" role="combobox" aria-expanded="false" aria-controls="matList" placeholder="Tap to choose or type to filter" autocomplete="off" spellcheck="false">' +
        '<button type="button" class="combo-toggle" id="matToggle" aria-label="Show all materials">&#9662;</button>' +
        '<ul id="matList" role="listbox" hidden></ul>' +
      '</div></div>' +
      '<div><label>Where is it?</label><div class="seg" id="locSeg">' + locs + '</div></div>' +
      '<button type="button" id="assignBtn">Assign tag to unit</button>' +
      '<button type="button" class="secondary" id="cancelBtn">Cancel</button>' +
    '</div>';

  $('locSeg').addEventListener('click', e => {
    const b = e.target.closest('button[data-loc]');
    if (!b) return;
    pickedLocation = b.dataset.loc;
    [...$('locSeg').children].forEach(x => x.setAttribute('aria-pressed', x === b));
  });
  setupCombo(current.materials);
  if (pickedMaterial) $('matInput').value = pickedMaterial;
  $('cancelBtn').onclick = closePanel;
  $('assignBtn').onclick = doAssign;
}

function setupCombo(materials) {
  const input = $('matInput'), list = $('matList'), toggle = $('matToggle');
  const low = v => v.trim().toLowerCase();
  const exact = () => materials.find(m => low(m) === low(input.value));

  function show(forceAll) {
    const q = low(input.value);
    // Once a full material is chosen (or nothing typed), show the whole list so neighbors are one tap away
    const items = (forceAll || !q || exact()) ? materials : materials.filter(m => low(m).includes(q));
    const chosen = exact();
    list.innerHTML = items.length
      ? items.map(m => '<li role="option" data-v="' + esc(m) + '"' + (m === chosen ? ' aria-selected="true"' : '') + '>' + esc(m) + '</li>').join('')
      : '<li class="none">No match on the Materials list</li>';
    list.hidden = false;
    input.setAttribute('aria-expanded', 'true');
    const sel = list.querySelector('[aria-selected="true"]');
    if (sel) sel.scrollIntoView({ block: 'nearest' });
  }
  function hide() { list.hidden = true; input.setAttribute('aria-expanded', 'false'); }

  input.addEventListener('focus', () => { input.select(); show(false); });
  input.addEventListener('click', () => show(false));
  input.addEventListener('input', () => show(false));
  input.addEventListener('blur', hide);
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') hide();
    if (e.key === 'Enter') {
      e.preventDefault();
      const first = list.querySelector('li[data-v]');
      if (!list.hidden && first && !exact()) { input.value = first.dataset.v; }
      hide();
    }
  });

  // mousedown + preventDefault keeps focus in the input so blur doesn't close the list before the tap registers
  list.addEventListener('mousedown', e => {
    e.preventDefault();
    const li = e.target.closest('li[data-v]');
    if (li) { input.value = li.dataset.v; hide(); }
  });
  toggle.addEventListener('mousedown', e => {
    e.preventDefault();
    if (list.hidden) { input.focus(); show(true); } else { hide(); }
  });
}

function renderActive(panel, tag) {
  const others = current.locations.filter(l => l !== tag.location);
  const moves = others.map(l => '<button type="button" data-to="' + esc(l) + '" aria-pressed="false">' + esc(short(l)) + '</button>').join('');
  const outs = OUT_OPTIONS.map(r => '<button type="button" class="danger" data-to="' + esc(r) + '" aria-pressed="false">' + esc(r) + '</button>').join('');
  pickedTo = '';

  panel.innerHTML =
    '<div class="stack">' +
      '<div><span class="tagid">' + esc(tag.id) + '</span> <span class="badge">In stock</span>' +
      '<dl class="facts"><dt>Material</dt><dd>' + esc(tag.material) + '</dd><dt>Location</dt><dd>' + esc(tag.location) + '</dd></dl></div>' +
      '<div><label>Move this unit to</label><div class="seg" id="moveSeg">' + moves + '</div></div>' +
      '<div><label>Take out of inventory</label><div class="seg" id="outSeg">' + outs + '</div></div>' +
      '<div class="confirmbox" id="confirmBox" hidden></div>' +
      '<button type="button" id="confirmBtn" disabled>Confirm change</button>' +
      '<button type="button" class="secondary" id="cancelBtn">Cancel</button>' +
    '</div>';

  const handler = e => {
    const b = e.target.closest('button[data-to]');
    if (!b) return;
    pickedTo = b.dataset.to;
    panel.querySelectorAll('button[data-to]').forEach(x => x.setAttribute('aria-pressed', x === b));
    const gone = OUT_OPTIONS.includes(pickedTo);
    $('confirmBox').hidden = false;
    $('confirmBox').className = 'confirmbox' + (gone ? ' out' : '');
    $('confirmBox').innerHTML = gone
      ? 'Take <strong>' + esc(tag.material) + '</strong> out of inventory (' + esc(pickedTo) + ')?'
      : 'Move <strong>' + esc(tag.material) + '</strong> from ' + esc(tag.location) + ' to <strong>' + esc(pickedTo) + '</strong>?';
    $('confirmBtn').disabled = false;
  };
  $('moveSeg').addEventListener('click', handler);
  $('outSeg').addEventListener('click', handler);
  $('confirmBtn').onclick = () => { if (pickedTo) doMove(pickedTo); };
  $('cancelBtn').onclick = closePanel;
}

function closePanel() {
  $('panel').hidden = true;
  current = null;
  $('tagInput').value = '';
}

/* ---------- actions ---------- */

function doAssign() {
  const typed = $('matInput').value.trim();
  if (!typed) return toast('Choose a material', 'err');
  const match = current.materials.find(m => m.toLowerCase() === typed.toLowerCase());
  if (!match) return toast('"' + typed + '" is not on the Materials list. Pick one from the list.', 'err');
  if (!pickedLocation) return toast('Choose a location', 'err');
  pickedMaterial = match;
  photoData = '';
  renderPhotoStep();
}

function compressImage(file, maxEdge = 1600, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxEdge / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * scale);
      c.height = Math.round(img.naturalHeight * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read that photo. Try again.')); };
    img.src = url;
  });
}

function renderPhotoStep() {
  const tag = current.tag;
  $('panel').innerHTML =
    '<div class="stack">' +
      '<div><span class="tagid">' + esc(tag.id) + '</span>' +
      '<dl class="facts"><dt>Material</dt><dd>' + esc(pickedMaterial) + '</dd><dt>Location</dt><dd>' + esc(pickedLocation) + '</dd></dl></div>' +
      '<div><label>Photo of the sawmill tag</label>' +
      '<p class="muted" style="margin:0">Take a clear photo of the sawmill tag on this unit. The tag is assigned when the photo saves.</p></div>' +
      '<img id="photoPreview" class="preview" alt="Sawmill tag photo preview" hidden>' +
      '<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>' +
      '<button type="button" id="takeBtn">Take photo</button>' +
      '<button type="button" id="saveBtn" disabled>Save photo and assign</button>' +
      '<button type="button" class="secondary" id="backBtn">Back</button>' +
    '</div>';

  $('takeBtn').onclick = () => $('photoInput').click();
  $('photoInput').onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      const dataUrl = await compressImage(f);
      photoData = dataUrl.split(',')[1];
      $('photoPreview').src = dataUrl;
      $('photoPreview').hidden = false;
      $('takeBtn').textContent = 'Retake photo';
      $('takeBtn').className = 'secondary';
      $('saveBtn').disabled = false;
    } catch (err) {
      toast(err.message, 'err');
    }
    e.target.value = '';
  };
  $('saveBtn').onclick = doAssignWithPhoto;
  $('backBtn').onclick = () => { photoData = ''; renderPanel(); };
}

async function doAssignWithPhoto() {
  if (!photoData) return toast('Take a photo of the sawmill tag first', 'err');
  const tag = current.tag;
  const buttons = document.querySelectorAll('#panel button');
  buttons.forEach(b => b.disabled = true);
  $('saveBtn').textContent = 'Saving…';
  try {
    const d = await post({ action: 'assign', id: tag.id, material: pickedMaterial, location: pickedLocation, photo: photoData });
    if (d.error) throw new Error(d.error);
    toast(tag.id + ' assigned: ' + d.tag.material + ' at ' + d.tag.location + ' (photo saved)');
    photoData = '';
    closePanel();
    loadInventory();
  } catch (e) {
    toast(e.message, 'err');
    buttons.forEach(b => b.disabled = false);
    $('saveBtn').textContent = 'Save photo and assign';
  }
}

async function doMove(to) {
  const tag = current.tag;
  document.querySelectorAll('#panel button').forEach(b => b.disabled = true);
  try {
    const d = await post({ action: 'move', id: tag.id, to });
    if (d.error) throw new Error(d.error);
    const gone = OUT_OPTIONS.includes(to);
    toast(gone ? tag.id + ' removed from inventory (' + to + ')' : tag.id + ' moved to ' + to);
    closePanel();
    loadInventory();
  } catch (e) {
    toast(e.message, 'err');
    document.querySelectorAll('#panel button').forEach(b => b.disabled = false);
  }
}

/* ---------- wire up ---------- */

$('scanBtn').addEventListener('click', startScan);
$('manualForm').addEventListener('submit', e => { e.preventDefault(); stopScan(); lookup($('tagInput').value); });
$('refreshBtn').addEventListener('click', loadInventory);

if (API_URL.startsWith('PASTE')) {
  $('inventory').innerHTML = '<p class="muted">Set API_URL at the top of index.html to your Apps Script Web app URL.</p>';
} else {
  loadInventory();
}
</script>
</body>
</html>
